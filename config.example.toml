# ❂ KAVA — Cosmic Audio Kaleidoscope Configuration
# Place this file at ~/.config/kava/config.toml

# Initial visual physics engine (1 to 6):
#   1 = Sacred Dihedral Mandala (Harmonic interference & lotus geometry)
#   2 = Hyperbolic Poincare Disk (Conformal Mobius transformation)
#   3 = Chladni Cymatic Resonance (2D Helmholtz standing wave nodal plate)
