[package]
name = "kava"
version = "0.2.0"
edition = "2021"
description = "Physics-accurate terminal audio-reactive kaleidoscope & sacred geometry visualizer (like CAVA, on cosmic steroids)"
authors = ["kava contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/eyeblech/kava"
keywords = ["audio", "visualizer", "kaleidoscope", "terminal", "cava"]
categories = ["command-line-utilities", "multimedia::audio", "visualization"]

[[bin]]
name = "kava"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
